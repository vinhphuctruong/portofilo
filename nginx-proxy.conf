server {
    listen 80;
    server_name vinhphucdev.id.vn www.vinhphucdev.id.vn;
    # Tự động chuyển hướng từ HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vinhphucdev.id.vn www.vinhphucdev.id.vn;

    # Đường dẫn chứng chỉ (container nginx sẽ map volume vào đây)
    ssl_certificate /etc/nginx/ssl/vinhphucdev.crt;
    ssl_certificate_key /etc/nginx/ssl/vinhphucdev.key;

    # Chặn hoàn toàn truy cập Admin từ mạng Internet
    location = /admin.html {
        deny all;
    }
    location = /login.html {
        deny all;
    }

    location / {
        proxy_pass http://167.233.61.186:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
